# Reference price catalog (fallback when the Floci Pricing API has no SKU).
#
# Values approximate AWS public On-Demand list prices for us-east-1 and were
# entered by hand as DOCUMENTED ASSUMPTIONS. They are not retrieved from an API.
# Any row the app shows from this file has source = "reference_assumption".
# EC2 instance prices come from data/reference/ec2_instances.csv instead.
#
# Schema: service -> product -> variant -> {unit, price, description}

AmazonS3:
  STANDARD:
    storage: {unit: GB-Mo, price: 0.023, description: "S3 Standard storage, first 50 TB"}
    retrieval: {unit: GB, price: 0.0, description: "No retrieval fee"}
  STANDARD_IA:
    storage: {unit: GB-Mo, price: 0.0125, description: "S3 Standard-IA storage (30-day minimum)"}
    retrieval: {unit: GB, price: 0.01, description: "Standard-IA retrieval"}
  INTELLIGENT_TIERING:
    storage: {unit: GB-Mo, price: 0.023, description: "Intelligent-Tiering frequent tier (+ monitoring fee excluded)"}
    retrieval: {unit: GB, price: 0.0, description: "No retrieval fee"}
  GLACIER_IR:
    storage: {unit: GB-Mo, price: 0.004, description: "Glacier Instant Retrieval (90-day minimum)"}
    retrieval: {unit: GB, price: 0.03, description: "Glacier IR retrieval"}
  GLACIER:
    storage: {unit: GB-Mo, price: 0.0036, description: "Glacier Flexible Retrieval (90-day minimum)"}
    retrieval: {unit: GB, price: 0.01, description: "Standard retrieval, 3-5 h"}
  DEEP_ARCHIVE:
    storage: {unit: GB-Mo, price: 0.00099, description: "Glacier Deep Archive (180-day minimum)"}
    retrieval: {unit: GB, price: 0.02, description: "Standard retrieval, up to 12 h"}
  REQUESTS:
    put: {unit: "1K requests", price: 0.005, description: "PUT/COPY/POST/LIST per 1,000"}
    get: {unit: "1K requests", price: 0.0004, description: "GET/SELECT per 1,000"}

